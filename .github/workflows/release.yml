name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  release:
    name: Build & release
    needs: check
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.check.outputs.desktop }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # desktop installers only rebuild when their version is bumped
      - id: check
        run: |
          BEFORE="${{ github.event.before }}"
          [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] && BEFORE="HEAD~1"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             git log "$BEFORE..HEAD" -- desktop/package.json | grep -q .; then
            echo "desktop=true" >> $GITHUB_OUTPUT
          else
            echo "desktop=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Build bundle, extensions and userscript
        run: npm run build

      - name: Ensure rolling releases exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ensure() {
            gh release view "$1" >/dev/null 2>&1 || gh release create "$1" --prerelease --notes ""
            gh release edit "$1" --prerelease --title "$2" --notes-file "$3"
          }
          cat > latest.md <<'EOF'
          Rolling build of the main branch.

          - `taut.js` / `taut.debug.js`: the app bundle every loader fetches (`debug` carries sourcemaps)
          - `taut.user.js`: userscript; `taut-chrome.zip` / `taut-firefox.xpi`: browser extensions
          - `taut-mac*.dmg`, `taut-win*.exe`, `taut-linux*.{AppImage,deb,rpm,pacman}`: desktop installers

          Install instructions are in the [README](https://github.com/jeremy46231/taut#quickstart).
          EOF
          cat > repo.md <<'EOF'
          apt and dnf indexes read by https://taut.jer.app/apt and https://taut.jer.app/rpm, see the
          [README](https://github.com/jeremy46231/taut#quickstart) for more.
          EOF
          ensure latest "Latest build" latest.md
          ensure repo "Package repository metadata" repo.md

      - name: Publish to latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload latest --clobber \
            dist/taut.js \
            dist/taut.debug.js \
            dist/userscript/*.user.js \
            dist/extension/*.zip \
            dist/extension/*.xpi

  release-desktop:
    name: Desktop (${{ matrix.platforms }})
    needs: release
    if: needs.release.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platforms: linux win win-arm
          - os: macos-latest
            platforms: mac mac-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Install rpmbuild
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Check for signing certificate
        if: runner.os == 'macOS'
        id: signing
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
        run: |
          if [ -n "$MAC_CERT_P12" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MAC_CERT_P12 not set; building macOS app UNSIGNED (notifications will not register)."
          fi

      - name: Set up macOS signing keychain
        if: steps.signing.outputs.enabled == 'true'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/taut-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          P12="$RUNNER_TEMP/taut-cert.p12"
          CER="$RUNNER_TEMP/taut-cert.cer"

          echo "$MAC_CERT_P12" | base64 --decode > "$P12"

          # Create, configure and unlock a dedicated keychain
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          # Import cert + private key; let codesign use the key non-interactively
          security import "$P12" -P "$MAC_CERT_PASSWORD" -f pkcs12 \
            -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null

          # Trust the self-signed cert as a code-signing anchor so that
          # `security find-identity -v` (used by electron-builder) lists it.
          openssl pkcs12 -legacy -in "$P12" -clcerts -nokeys \
            -passin pass:"$MAC_CERT_PASSWORD" -out "$CER"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$CER"

          # Put our keychain first in the search list so it's discoverable
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build desktop
        env:
          CSC_NAME:
            ${{ steps.signing.outputs.enabled == 'true' && 'Taut Code Signing'
            || '' }}
          CSC_KEYCHAIN:
            ${{ steps.signing.outputs.enabled == 'true' &&
            format('{0}/taut-signing.keychain-db', runner.temp) || '' }}
        run: npm run build -- desktop ${{ matrix.platforms }}

      - name: Build apt and dnf repositories
        if: runner.os == 'Linux'
        env:
          REPO_GPG_KEY: ${{ secrets.REPO_GPG_KEY }}
        run: |
          if [ -z "$REPO_GPG_KEY" ]; then
            echo "::warning::REPO_GPG_KEY not set; skipping apt/dnf repository metadata."
            exit 0
          fi
          sudo apt-get install -y createrepo-c
          echo "$REPO_GPG_KEY" | gpg --batch --import
          npm run repo

      - name: Publish desktop to latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload latest --clobber dist/desktop/*

      - name: Publish repository metadata
        if: runner.os == 'Linux' && hashFiles('dist/repo/*') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload repo --clobber dist/repo/*
