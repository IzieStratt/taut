name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  release:
    name: Build & release
    needs: check
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.check.outputs.desktop }}
      desktop-tag: ${{ steps.desktop-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # desktop installers only rebuild when their version is bumped
      - id: check
        run: |
          BEFORE="${{ github.event.before }}"
          [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] && BEFORE="HEAD~1"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             git log "$BEFORE..HEAD" -- desktop/package.json | grep -q .; then
            echo "desktop=true" >> $GITHUB_OUTPUT
          else
            echo "desktop=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Build bundle, extensions and userscript
        run: npm run build

      - name: Update rolling releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f latest && git tag -f repo
          git push -f origin refs/tags/latest refs/tags/repo
          ensure() {
            gh release view "$1" >/dev/null 2>&1 || gh release create "$1" --notes "" "${@:4}"
            gh release edit "$1" --title "$2" --notes-file "$3" "${@:4}"
          }
          cat > latest.md <<'MD'
          Rolling build of the main branch.

          - `taut.js` / `taut.debug.js`: the app bundle every loader fetches (`debug` carries sourcemaps)
          - `taut.user.js`: userscript; `taut-chrome.zip` / `taut-firefox.xpi`: browser extensions
          - `taut-mac*.dmg`, `taut-win*.exe`, `taut-linux*.{AppImage,deb,rpm,pacman}`: desktop installers,
            with version history in the `desktop-v*` releases

          Install instructions are in the [README](https://github.com/jeremy46231/taut#quickstart).
          MD
          cat > repo.md <<'MD'
          apt and dnf indexes read by https://taut.jer.app/apt and https://taut.jer.app/rpm, see the
          [README](https://github.com/jeremy46231/taut#quickstart) for more.
          MD
          ensure latest "Latest build" latest.md --latest --prerelease=false
          ensure repo "Package repository metadata" repo.md --prerelease

      - name: Publish to latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload latest --clobber \
            dist/taut.js \
            dist/taut.debug.js \
            dist/userscript/*.user.js \
            dist/extension/*.zip

      - name: Sign and publish the Firefox extension
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          UPDATES: ${{ github.server_url }}/${{ github.repository }}/releases/download/latest/taut-firefox-updates.json
        run: |
          version="$(jq -r .version extension/firefox/manifest.json)"
          # AMO refuses a version it has already signed
          published="$(curl -fsSL "$UPDATES" | jq -r '.addons[].updates[0].version')" ||
            published=""
          if [ "$version" = "$published" ]; then
            echo "Firefox $version is already signed and published"
            exit 0
          fi
          if [ -z "$AMO_JWT_ISSUER" ]; then
            echo "::warning::AMO_JWT_ISSUER not set; the latest release keeps signed Firefox ${published:-none}."
            exit 0
          fi
          npx --yes web-ext@10 sign \
            --source-dir dist/extension/firefox \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --artifacts-dir dist/extension/signed
          mv dist/extension/signed/*.xpi dist/extension/taut-firefox.xpi
          gh release upload latest --clobber \
            dist/extension/taut-firefox.xpi \
            dist/extension/taut-firefox-updates.json

      - name: Create desktop release
        if: steps.check.outputs.desktop == 'true'
        id: desktop-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="desktop-v$(jq -r .version desktop/package.json)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          gh release create "$TAG" --target "$GITHUB_SHA" --latest=false \
            --title "Desktop ${TAG#desktop-}" \
            --notes "Taut desktop ${TAG#desktop-}. The \`latest\` release always has the newest installers, see the [README](https://github.com/jeremy46231/taut#quickstart) to install."

  release-desktop:
    name: Desktop (${{ matrix.platforms }})
    needs: release
    if: needs.release.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            platforms: linux linux-arm
          - os: ubuntu-latest
            platforms: win win-arm
          - os: macos-latest
            platforms: mac mac-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Install packaging and native module build deps
        if: contains(matrix.platforms, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools libx11-dev libxkbfile-dev

      # arm64 replacements for slack's native modules, see scripts/lib/natives.ts
      - name: Build native modules
        if: contains(matrix.platforms, 'linux-arm')
        run: npm run build:natives

      - name: Check for signing certificate
        if: runner.os == 'macOS'
        id: signing
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
        run: |
          if [ -n "$MAC_CERT_P12" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MAC_CERT_P12 not set; building macOS app UNSIGNED (notifications will not register)."
          fi

      - name: Set up macOS signing keychain
        if: steps.signing.outputs.enabled == 'true'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/taut-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          P12="$RUNNER_TEMP/taut-cert.p12"
          CER="$RUNNER_TEMP/taut-cert.cer"

          echo "$MAC_CERT_P12" | base64 --decode > "$P12"

          # Create, configure and unlock a dedicated keychain
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          # Import cert + private key; let codesign use the key non-interactively
          security import "$P12" -P "$MAC_CERT_PASSWORD" -f pkcs12 \
            -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null

          # Trust the self-signed cert as a code-signing anchor so that
          # `security find-identity -v` (used by electron-builder) lists it.
          openssl pkcs12 -legacy -in "$P12" -clcerts -nokeys \
            -passin pass:"$MAC_CERT_PASSWORD" -out "$CER"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$CER"

          # Put our keychain first in the search list so it's discoverable
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build desktop
        env:
          CSC_NAME:
            ${{ steps.signing.outputs.enabled == 'true' && 'Taut Code Signing'
            || '' }}
          CSC_KEYCHAIN: ${{ steps.signing.outputs.enabled == 'true' &&
            format('{0}/taut-signing.keychain-db', runner.temp) || '' }}
        run: npm run build -- desktop ${{ matrix.platforms }}

      - name: Build apt and dnf repositories
        if: contains(matrix.platforms, 'linux')
        env:
          REPO_GPG_KEY: ${{ secrets.REPO_GPG_KEY }}
        run: |
          if [ -z "$REPO_GPG_KEY" ]; then
            echo "::warning::REPO_GPG_KEY not set; skipping apt/dnf repository metadata."
            exit 0
          fi
          sudo apt-get install -y createrepo-c
          echo "$REPO_GPG_KEY" | gpg --batch --import
          npm run repo

      - name: Publish desktop to latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload latest --clobber dist/desktop/*

      - name: Publish desktop to ${{ needs.release.outputs.desktop-tag }}
        id: versioned
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.desktop-tag }}
        run: |
          existing="$(gh release view "$TAG" --json assets -q '.assets[].name')"
          uploaded=""
          for file in dist/desktop/*; do
            name="$(basename "$file")"
            if grep -qxF "$name" <<<"$existing"; then
              echo "$name is already published, keeping it"
              continue
            fi
            gh release upload "$TAG" "$file"
            uploaded="$uploaded $name"
          done
          echo "uploaded=$uploaded" >> "$GITHUB_OUTPUT"

      - name: Pin the AppImages in flake.nix
        if: contains(steps.versioned.outputs.uploaded, '.AppImage')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.desktop-tag }}
          UPLOADED: ${{ steps.versioned.outputs.uploaded }}
        run: |
          pin() {
            grep -qF " $2 " <<<" $UPLOADED " || return 0
            hash="sha256-$(openssl dgst -sha256 -binary "dist/desktop/$2" | base64)"
            sed -i -E "s|^(        $1 = )\"(sha256-[^\"]*)?\";$|\1\"$hash\";|" flake.nix
            grep -qF "$1 = \"$hash\";" flake.nix
          }
          sed -i -E "s|^(      version = )\"[^\"]*\";$|\1\"${TAG#desktop-v}\";|" flake.nix
          grep -qF "version = \"${TAG#desktop-v}\";" flake.nix
          pin x86_64-linux taut-linux.AppImage
          pin aarch64-linux taut-linux-arm.AppImage
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/flake.nix" \
            -f branch=main \
            -f message="nix: pin desktop ${TAG#desktop-}" \
            -f sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/flake.nix?ref=main" -q .sha)" \
            -f content="$(base64 -w0 flake.nix)"

      - name: Publish repository metadata
        if: hashFiles('dist/repo/*') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload repo --clobber dist/repo/*
